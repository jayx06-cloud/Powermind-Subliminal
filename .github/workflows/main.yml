          cat << 'EOF' > app/src/main/java/com/powermind/subliminal/SubliminalOverlayService.kt
          package com.powermind.subliminal
          import android.app.*;import android.content.*;import android.graphics.*;import android.os.*;import android.text.*;import android.text.style.ForegroundColorSpan;import android.view.*;import android.widget.TextView;import androidx.core.app.NotificationCompat;import kotlin.random.Random
          class SubliminalOverlayService:Service(){
          private var wm:WindowManager?=null;private var v:TextView?=null;private var p:WindowManager.LayoutParams?=null;private val h=Handler(Looper.getMainLooper());private var run=false
          private var list=listOf("MUST STAY FOCUSED","CREATE MY REALITY","MONEY MAGNET");private var cols=intArrayOf(Color.WHITE);private var fnts=intArrayOf(0);private var sz=28f;private var iv=400L;private var dur=10L;private var alp=0.03f;private var rnd=true;private var mir=true;private var jit=true;private var pyFoc=true;private var runeOn=true
          private val runes=listOf("ᚠ","ᛏ","ᛋ","ᚢ","ᛉ","ᛃ")
          override fun onBind(i:Intent?)=null
          override fun onCreate(){super.onCreate()
          if(Build.VERSION.SDK_INT>=26){getSystemService(NotificationManager::class.java)?.createNotificationChannel(NotificationChannel("pm","PM",NotificationManager.IMPORTANCE_LOW))}
          startForeground(1,NotificationCompat.Builder(this,"pm").setContentTitle("PowerMind Active").setSmallIcon(android.R.drawable.ic_dialog_info).build())
          wm=getSystemService(Context.WINDOW_SERVICE) as WindowManager
          val t=if(Build.VERSION.SDK_INT>=26)WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE
          p=WindowManager.LayoutParams(WindowManager.LayoutParams.WRAP_CONTENT,WindowManager.LayoutParams.WRAP_CONTENT,t,WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,PixelFormat.TRANSLUCENT).apply{gravity=Gravity.CENTER}
          v=TextView(this).apply{textSize=28f;setTextColor(Color.WHITE);visibility=View.GONE};wm?.addView(v,p)}
          override fun onStartCommand(intent:Intent?,flags:Int,id:Int):Int{
          intent?.let{list=it.getStringArrayExtra("P")?.toList()?:list;cols=it.getIntArrayExtra("COLS")?:cols;fnts=it.getIntArrayExtra("FNTS")?:fnts;sz=it.getFloatExtra("S",28f);iv=it.getLongExtra("I",400L);dur=it.getLongExtra("D",10L);alp=it.getFloatExtra("A",0.03f);rnd=it.getBooleanExtra("RND",true);mir=it.getBooleanExtra("MIR",true);jit=it.getBooleanExtra("JIT",true);pyFoc=it.getBooleanExtra("PYR",true);runeOn=it.getBooleanExtra("RUNE",true)}
          if(!run){run=true;loop()};return START_STICKY}
          private fun loop(){if(!run||list.isEmpty())return
          val wait=if(jit)Random.nextLong((iv*0.85).toLong().coerceAtLeast(50L),(iv*1.15).toLong()) else iv
          h.postDelayed({
          val phrase=if(runeOn&&Random.nextInt(3)==0)runes.random() else list.random()
          val chosenCol=if(cols.isNotEmpty())cols.random() else Color.WHITE;val chosenFnt=if(fnts.isNotEmpty())fnts.random() else 0
          v?.apply{
          if(mir&&phrase.length>1){
          val sb=StringBuilder();for(c in phrase.filter{it in 'A'..'Z'}.take(7)){sb.append(c).append("  ").append(c).append("\n")}
          val s=SpannableString(sb.toString())
          var idx=0;while(idx<s.length){val next=s.indexOf("\n",idx);val lineEnd=if(next!=-1)next else s.length;val mid=idx+(lineEnd-idx)/2
          if(mid<lineEnd)s.setSpan(ForegroundColorSpan(Color.RED),mid,lineEnd,Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);if(next==-1)break;idx=next+1}
          text=s}else{text=phrase}
          textSize=sz;setTextColor(chosenCol);typeface=when(chosenFnt){1->Typeface.SANS_SERIF;2->Typeface.SERIF;3->Typeface.create("cursive",Typeface.NORMAL);else->Typeface.MONOSPACE};alpha=alp;visibility=View.VISIBLE}
          p?.let{val m=resources.displayMetrics
          if(rnd){val isLeft=Random.nextBoolean();val xMin=if(isLeft)-m.widthPixels/3 else m.widthPixels/5;val xMax=if(isLeft)-m.widthPixels/5 else m.widthPixels/3;it.x=Random.nextInt(xMin,xMax)}else{it.x=0}
          it.y=if(pyFoc)(m.heightPixels*0.16f).toInt() else 0
          wm?.updateViewLayout(v,it)}
          if(dur<=16){Choreographer.getInstance().postFrameCallback{v?.visibility=View.GONE;loop()}}else{h.postDelayed({v?.visibility=View.GONE;loop()},dur)}},wait)}
          override fun onDestroy(){super.onDestroy();run=false;h.removeCallbacksAndMessages(null);v?.let{wm?.removeView(it)}}}
          EOF
