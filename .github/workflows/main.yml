                              VowelRadioRow("Keep A & I (Page 24 Rule)", vowelMode == VowelMode.KEEP_A_AND_I) { vowelMode = VowelMode.KEEP_A_AND_I }
                              VowelRadioRow("Sigil Magic (Vowels + Duplicates Removed)", vowelMode == VowelMode.SIGIL_MAGIC) { vowelMode = VowelMode.SIGIL_MAGIC }
                              VowelRadioRow("Raw Affirmations", vowelMode == VowelMode.RAW_TEXT) { vowelMode = VowelMode.RAW_TEXT }
