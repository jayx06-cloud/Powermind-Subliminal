          for(deg in 0..7){val a=Math.toRadians(deg*45.0);val x2=(c.x+r*cos(a)).toFloat();val y2=(c.y+r*sin(a)).toFloat();drawLine(Color(0xFF38BDF8).copy(alpha=if(isMask)0.35f else 0.14f),c,Offset(x2,y2),2.dp.toPx())}
