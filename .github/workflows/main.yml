          TvClickableRow(checked=jitterMode,label="Micro-Jitter Timing (Anti-Anticipation ±15%)"){jitterMode=!jitterMode}
          }}
          Card(modifier=Modifier.weight(1.1f).fillMaxHeight(),colors=CardDefaults.cardColors(containerColor=Color(0xFF111827))){Column(Modifier.padding(14.dp).verticalScroll(rememberScrollState()),verticalArrangement=Arrangement.spacedBy(10.dp)){
          Text("CONTROLS & SESSION LAUNCH",fontWeight=FontWeight.Bold,fontSize=13.sp,color=Color(0xFF38BDF8))
          Row(Modifier.fillMaxWidth(),horizontalArrangement=Arrangement.spacedBy(8.dp)){
          Button(onClick={isInfiniteSession=false;videoActive=true;if(masterAudioOn)AudioTrackEngine.start()},modifier=Modifier.weight(1f).height(46.dp),colors=ButtonDefaults.buttonColors(containerColor=Color(0xFF0284C7))){Text("▶ 5-MIN PROTOCOL",fontWeight=FontWeight.Bold,fontSize=11.sp)}
          Button(onClick={isInfiniteSession=true;videoActive=true;if(masterAudioOn)AudioTrackEngine.start()},modifier=Modifier.weight(1f).height(46.dp),colors=ButtonDefaults.buttonColors(containerColor=Color(0xFF16A34A))){Text("♾️ CONTINUOUS AMBIENT",fontWeight=FontWeight.Bold,fontSize=11.sp)}}
          Button(onClick={intervalSec=0.4f;durationMs=10f;contrast=0.03f;jitterMode=true;altSigilMode=true;pyramidFocal=true;dualPillars=true;runeMode=true;visionBoardOn=true;maskingOn=true;selModes.clear();selModes[0]=true;selModes[2]=true},modifier=Modifier.fillMaxWidth().height(42.dp),colors=ButtonDefaults.buttonColors(containerColor=Color(0xFF7C3AED))){Text("⚡ 1-TAP RECOMMENDED (MAX ABSORPTION)",fontWeight=FontWeight.Bold,fontSize=11.sp)}
          Spacer(Modifier.height(4.dp))
          Surface(onClick={masterAudioOn=!masterAudioOn;if(masterAudioOn)AudioTrackEngine.start() else AudioTrackEngine.stop()},shape=RoundedCornerShape(6.dp),color=if(masterAudioOn)Color(0xFF065F46) else Color(0xFF7F1D1D),modifier=Modifier.fillMaxWidth()){
          Row(Modifier.padding(horizontal=14.dp,vertical=10.dp),verticalAlignment=Alignment.CenterVertically){Text(if(masterAudioOn)"🔊 MASTER AUDIO: ON (528Hz + 136.1Hz OM Active)" else "🔇 MASTER AUDIO: OFF (MUTED)",color=Color.White,fontWeight=FontWeight.Bold,fontSize=12.sp)}}
          Row(Modifier.fillMaxWidth(),horizontalArrangement=Arrangement.spacedBy(8.dp),verticalAlignment=Alignment.CenterVertically){
          Text("Flash Every: ${(intervalSec*10).toInt()/10f}s",color=Color.LightGray,fontSize=12.sp,modifier=Modifier.weight(1f))
