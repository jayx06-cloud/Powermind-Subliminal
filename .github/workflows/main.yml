          TvClickableRow(checked=visionBoardOn,label="Vision Board Flashes (£ Ingot, Estate, DNA)"){visionBoardOn=!visionBoardOn}
          TvClickableRow(checked=pyramidFocal,label="Pyramid 1/3 Base Energy Plane (Page 49)"){pyramidFocal=!pyramidFocal}
