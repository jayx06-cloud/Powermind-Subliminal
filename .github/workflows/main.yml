          Text("SUB-CONSCIOUS ENGINES",fontWeight=FontWeight.Bold,fontSize=13.sp,color=Color(0xFFFACC15))
          TvClickableRow(checked=selModes[0]?:false,label="All Vowels Removed ([AEIOU] stripped)"){selModes[0]=!(selModes[0]?:false)}
          TvClickableRow(checked=selModes[1]?:false,label="Keep A & I (Page 24 rule)"){selModes[1]=!(selModes[1]?:false)}
          TvClickableRow(checked=selModes[2]?:false,label="Sigil Magic Auto (Deduplicated, Page 25)"){selModes[2]=!(selModes[2]?:false)}
          TvClickableRow(checked=selModes[3]?:false,label="Raw Affirmations"){selModes[3]=!(selModes[3]?:false)}
