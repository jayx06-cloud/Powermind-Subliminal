          if(showAbout){AboutGuideDialog{showAbout=false}}
          if(videoActive){
          FireTvSacredSession(activePhrases,(intervalSec*1000).toLong(),durationMs.toLong(),contrast,colorInts,fontSize,fonts,jitterMode,pyramidFocal,dualPillars,altSigilMode,runeMode,masterAudioOn,visionBoardOn,maskingOn,isInfiniteSession){AudioTrackEngine.stop();videoActive=false}
          }else{
          Scaffold(topBar={Surface(color=Color(0xFF0F172A)){Row(Modifier.fillMaxWidth().padding(horizontal=24.dp,vertical=10.dp),verticalAlignment=Alignment.CenterVertically){Text("POWER MIND SUBLIMINAL — FIRE TV CUBE",fontWeight=FontWeight.Bold,color=Color.White,fontSize=16.sp);Spacer(Modifier.width(16.dp));Text("All Programs (${phrases.size} Affirmations)",color=Color(0xFF38BDF8),fontSize=12.sp);Spacer(Modifier.weight(1f));Button(onClick={showNewDialog=true},contentPadding=PaddingValues(horizontal=10.dp,vertical=2.dp),modifier=Modifier.height(30.dp),colors=ButtonDefaults.buttonColors(containerColor=Color(0xFF0284C7))){Text("+ New Phrase",fontSize=11.sp)};Spacer(Modifier.width(8.dp));Button(onClick={showAbout=true},contentPadding=PaddingValues(horizontal=10.dp,vertical=2.dp),modifier=Modifier.height(30.dp),colors=ButtonDefaults.buttonColors(containerColor=Color(0xFF475569))){Text("ℹ️ Guide",fontSize=11.sp)}}}}){pad->
