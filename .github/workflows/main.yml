          Button(onClick={intervalSec=0.4f;durationMs=10f;contrast=0.03f;randomDisplay=true;jitterMode=true;mirrorMode=true;pyramidFocal=true;dualPillars=true;fontSize=20f;selModes.clear();selModes[0]=true;selModes[2]=true;selColors.clear();selColors[0]=true;selColors[2]=true;selColors[6]=true;selFonts.clear();selFonts[0]=true;musicOn=false;AudioTrackEngine.stop()},colors=ButtonDefaults.buttonColors(containerColor=Color(0xFF475569)),modifier=Modifier.weight(1.2f).height(44.dp)){Text("Restore Default",fontSize=10.sp)}
          Button(onClick={if(Build.VERSION.SDK_INT>=23&&!Settings.canDrawOverlays(ctx)){ctx.startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,Uri.parse("package:${ctx.packageName}")))}else{
          val it=Intent(ctx,SubliminalOverlayService::class.java).apply{putExtra("P",activePhrases.toTypedArray());putExtra("COLS",activeColorInts);putExtra("FNTS",activeFontIndices);putExtra("S",fontSize);putExtra("I",(intervalSec*1000).toLong());putExtra("D",durationMs.toLong());putExtra("A",contrast);putExtra("RND",randomDisplay);putExtra("MIR",mirrorMode);putExtra("JIT",jitterMode);putExtra("PYR",pyramidFocal)}
          if(!overlayActive){ctx.startService(it);overlayActive=true}else{ctx.stopService(it);overlayActive=false}}},colors=ButtonDefaults.buttonColors(containerColor=if(overlayActive)Color(0xFFDC2626) else Color(0xFF16A34A)),modifier=Modifier.weight(1f).height(44.dp)){Text(if(overlayActive)"Stop" else "Apply",fontWeight=FontWeight.Bold,fontSize=11.sp)}}
