name: Build PowerMind APK
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Create Project Files
        run: |
          mkdir -p app/src/main/java/com/powermind/subliminal

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "PowerMind"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.powermind.subliminal"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.powermind.subliminal"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation(platform("androidx.compose:compose-bom:2024.10.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application android:allowBackup="true" android:label="PowerMind" android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".SubliminalOverlayService" android:exported="false" android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="Subliminal overlay"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/powermind/subliminal/SubliminalOverlayService.kt
          package com.powermind.subliminal
          import android.app.*
          import android.content.*
          import android.graphics.*
          import android.os.*
          import android.view.*
          import android.widget.TextView
          import androidx.core.app.NotificationCompat
          import kotlin.random.Random

          class SubliminalOverlayService : Service() {
              private var wm: WindowManager? = null
              private var v: TextView? = null
              private var p: WindowManager.LayoutParams? = null
              private val h = Handler(Looper.getMainLooper())
              private var active = false
              private var list = listOf("MUST SWITCH OFF THE TV", "MUST STAY FOCUSED", "CREATE MY REALITY", "MONEY MAGNET", "INFINITE SUPPLY", "A WINNER")

              override fun onBind(i: Intent?): IBinder? = null
              override fun onCreate() {
                  super.onCreate()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val c = NotificationChannel("pm_fgs", "PowerMind", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java)?.createNotificationChannel(c)
                  }
                  startForeground(1001, NotificationCompat.Builder(this, "pm_fgs").setContentTitle("PowerMind Active").setContentText("Subconscious overlay running").setSmallIcon(android.R.drawable.ic_dialog_info).build())
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val t = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE
                  p = WindowManager.LayoutParams(WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT, t,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS, PixelFormat.TRANSLUCENT).apply { gravity = Gravity.CENTER }
                  v = TextView(this).apply { textSize = 28f; setTextColor(Color.WHITE); visibility = View.GONE }
                  wm?.addView(v, p)
              }
              override fun onStartCommand(intent: Intent?, flags: Int, id: Int): Int {
                  intent?.getStringArrayExtra("PHRASES")?.let { if (it.isNotEmpty()) list = it.toList() }
                  if (!active) { active = true; loop() }
                  return START_STICKY
              }
              private fun loop() {
                  if (!active) return
                  h.postDelayed({
                      val text = list.random()
                      v?.apply {
                          this.text = text
                          alpha = 0.05f
                          visibility = View.VISIBLE
                      }
                      p?.let {
                          val m = resources.displayMetrics
                          it.x = Random.nextInt(-m.widthPixels / 3, m.widthPixels / 3)
                          it.y = Random.nextInt(-m.heightPixels / 4, m.heightPixels / 4)
                          wm?.updateViewLayout(v, it)
                      }
                      h.postDelayed({ v?.visibility = View.GONE; loop() }, 16L)
                  }, 400L)
              }
              override fun onDestroy() { super.onDestroy(); active = false; h.removeCallbacksAndMessages(null); v?.let { wm?.removeView(it) } }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/powermind/subliminal/MainActivity.kt
          package com.powermind.subliminal
          import android.content.*
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.*
          import androidx.compose.ui.unit.*
          import kotlinx.coroutines.delay

          enum class VowelMode { NO_VOWELS, KEEP_A_I, RAW }

          class MainActivity : ComponentActivity() {
              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  setContent { MaterialTheme(colorScheme = darkColorScheme()) { UI() } }
              }
          }

          @Composable
          fun UI() {
              val ctx = LocalContext.current
              var mode by remember { mutableStateOf(VowelMode.NO_VOWELS) }
              var overlayActive by remember { mutableStateOf(false) }
              var sessionActive by remember { mutableStateOf(false) }

              val basePhrases = listOf(
                  "MUST SWITCH OFF THE TELEVISION", "MUST STAY FOCUSED", "MUST TAKE ACTION",
                  "BE SUCCESSFUL", "TURN DREAMS INTO REALITY", "THOUGHTS CREATE REALITY",
                  "WILL MAKE 100000 IN TWELVE MONTHS", "MONEY MAGNET", "INFINITE SUPPLY",
                  "HEALTHY MIND HEALTHY BODY", "CALM AND RELAXED", "A WINNER", "CREATE MY REALITY"
              )

              fun clean(text: String): String = when (mode) {
                  VowelMode.NO_VOWELS -> text.uppercase().replace(Regex("[AEIOU]"), "")
                  VowelMode.KEEP_A_I -> text.uppercase().replace(Regex("[EOU]"), "")
                  VowelMode.RAW -> text.uppercase()
              }

              val current = remember(mode) { basePhrases.map { clean(it) } }

              if (sessionActive) {
                  var flash by remember { mutableStateOf("") }
                  var vis by remember { mutableStateOf(false) }
                  LaunchedEffect(Unit) {
                      while (true) {
                          delay(400)
                          flash = current.random()
                          vis = true
                          delay(20)
                          vis = false
                      }
                  }
                  Box(Modifier.fillMaxSize().background(Color.Black).clickable { sessionActive = false }, Alignment.Center) {
                      if (vis) Text(flash, color = Color.White, fontSize = 28.sp, fontWeight = FontWeight.Bold, fontFamily = FontFamily.Monospace)
                      Text("Tap to exit", color = Color.Gray, modifier = Modifier.align(Alignment.BottomCenter).padding(20.dp))
                  }
                  return
              }

              Scaffold(topBar = { TopAppBar(title = { Text("POWERMIND SUBLIMINAL", fontWeight = FontWeight.Bold) }, colors = TopAppBarDefaults.topAppBarColors(containerColor = Color(0xFF101722))) }) { p ->
                  LazyColumn(Modifier.fillMaxSize().background(Color(0xFF080C12)).padding(p).padding(16.dp), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                      item {
                          Card(colors = CardDefaults.cardColors(containerColor = Color(0xFF17202E))) {
                              Column(Modifier.padding(14.dp)) {
                                  Text("LIVE REGISTRATION PREVIEW", color = Color.Gray, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                  Text("Original: CREATE MY REALITY", color = Color.LightGray, fontSize = 12.sp)
                                  Text("Subliminal: ${clean("CREATE MY REALITY")}", color = Color.Cyan, fontSize = 18.sp, fontWeight = FontWeight.Bold, fontFamily = FontFamily.Monospace)
                              }
                          }
                      }
                      item {
                          Text("VOWEL ENGINE", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 14.sp)
                          VowelMode.values().forEach { m ->
                              Row(Modifier.fillMaxWidth().clickable { mode = m }.padding(6.dp), verticalAlignment = Alignment.CenterVertically) {
                                  RadioButton(selected = mode == m, onClick = { mode = m })
                                  Text(m.name.replace("_", " "), color = Color.White, fontSize = 13.sp)
                              }
                          }
                      }
                      item {
                          Button(onClick = { sessionActive = true }, Modifier.fillMaxWidth().height(48.dp), colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF00897B))) {
                              Text("START IN-APP MEDITATION", fontWeight = FontWeight.Bold)
                          }
                          Spacer(Modifier.height(10.dp))
                          Button(onClick = {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(ctx)) {
                                  ctx.startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:${ctx.packageName}")))
                              } else {
                                  val it = Intent(ctx, SubliminalOverlayService::class.java).apply { putExtra("PHRASES", current.toTypedArray()) }
                                  if (!overlayActive) { ctx.startService(it); overlayActive = true } else { ctx.stopService(it); overlayActive = false }
                              }
                          }, Modifier.fillMaxWidth().height(48.dp), colors = ButtonDefaults.buttonColors(containerColor = if (overlayActive) Color.Red else Color(0xFF1E88E5))) {
                              Text(if (overlayActive) "STOP OVERLAY" else "LAUNCH SYSTEM OVERLAY", fontWeight = FontWeight.Bold)
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PowerMind-OnePlus15-APK
          path: app/build/outputs/apk/debug/app-debug.apk
