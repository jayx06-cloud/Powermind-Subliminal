          fun transformMode(u:String,m:Int):String=when(m){0->u.replace(Regex("[AEIOU]"),"");1->u.replace(Regex("[EOU]"),"");2->{val nv=u.replace(Regex("[AEIOU\\s]"),"");val sb=StringBuilder();val s=HashSet<Char>();for(c in nv)if(c in 'A'..'Z'&&s.add(c))sb.append(c);sb.toString()};else->u}
          val activePhrases=remember(phrases.size,selModes.toMap()){val activeModes=selModes.filter{it.value}.keys;val res=mutableListOf<String>();for(p in phrases){val u=p.uppercase().trim();if(activeModes.isEmpty())res.add(transformMode(u,0)) else for(m in activeModes)res.add(transformMode(u,m))};res}
