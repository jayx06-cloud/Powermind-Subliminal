name: Build PowerMind APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          mkdir -p app/src/main/java/com/powermind/subliminal
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          EOF
          echo 'pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}};dependencyResolutionManagement{repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS);repositories{google();mavenCentral()}};rootProject.name="PowerMind";include(":app")' > settings.gradle.kts
          echo 'plugins{id("com.android.application") version "8.7.2" apply false;id("org.jetbrains.kotlin.android") version "2.0.21" apply false;id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false}' > build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins{id("com.android.application");id("org.jetbrains.kotlin.android");id("org.jetbrains.kotlin.plugin.compose")}
          android{namespace="com.powermind.subliminal";compileSdk=34;defaultConfig{applicationId="com.powermind.subliminal";minSdk=26;targetSdk=34;versionCode=15;versionName="3.2"};buildTypes{release{isMinifyEnabled=false}};compileOptions{sourceCompatibility=JavaVersion.VERSION_17;targetCompatibility=JavaVersion.VERSION_17};kotlinOptions{jvmTarget="17";freeCompilerArgs+=listOf("-opt-in=androidx.compose.material3.ExperimentalMaterial3Api")};buildFeatures{compose=true};packaging{resources{excludes+="/META-INF/{AL2.0,LGPL2.1}"};jniLibs{useLegacyPackaging=true;keepDebugSymbols+="**/*.so"}}}
          dependencies{implementation("androidx.core:core-ktx:1.13.1");implementation("androidx.activity:activity-compose:1.9.3");implementation(platform("androidx.compose:compose-bom:2024.10.00"));implementation("androidx.compose.ui:ui");implementation("androidx.compose.material3:material3")}
          EOF
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><application android:allowBackup="true" android:label="PowerMind" android:theme="@android:style/Theme.Material.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><service android:name=".SubliminalOverlayService" android:exported="false" android:foregroundServiceType="specialUse"><property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="Subliminal"/></service></application></manifest>
          EOF
          cat << 'EOF' > app/src/main/java/com/powermind/subliminal/SubliminalOverlayService.kt
          package com.powermind.subliminal
          import android.app.*;import android.content.*;import android.graphics.*;import android.os.*;import android.text.*;import android.text.style.ForegroundColorSpan;import android.view.*;import android.widget.TextView;import androidx.core.app.NotificationCompat;import kotlin.random.Random
          class SubliminalOverlayService:Service(){
          private var wm:WindowManager?=null;private var v:TextView?=null;private var p:WindowManager.LayoutParams?=null;private val h=Handler(Looper.getMainLooper());private var run=false
          private var list=listOf("CREATE MY REALITY");private var col=Color.WHITE;private var sz=28f;private var fnt=0;private var iv=400L;private var dur=10L;private var alp=0.03f;private var rnd=false;private var mir=false
          override fun onBind(i:Intent?)=null
          override fun onCreate(){super.onCreate()
          if(Build.VERSION.SDK_INT>=26){getSystemService(NotificationManager::class.java)?.createNotificationChannel(NotificationChannel("pm","PM",NotificationManager.IMPORTANCE_LOW))}
          startForeground(1,NotificationCompat.Builder(this,"pm").setContentTitle("PowerMind Active").setSmallIcon(android.R.drawable.ic_dialog_info).build())
          wm=getSystemService(Context.WINDOW_SERVICE) as WindowManager
          val t=if(Build.VERSION.SDK_INT>=26)WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE
          p=WindowManager.LayoutParams(WindowManager.LayoutParams.WRAP_CONTENT,WindowManager.LayoutParams.WRAP_CONTENT,t,WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,PixelFormat.TRANSLUCENT).apply{gravity=Gravity.CENTER}
          v=TextView(this).apply{textSize=28f;setTextColor(Color.WHITE);visibility=View.GONE};wm?.addView(v,p)}
          override fun onStartCommand(intent:Intent?,flags:Int,id:Int):Int{
          intent?.let{list=it.getStringArrayExtra("P")?.toList()?:list;col=it.getIntExtra("C",Color.WHITE);sz=it.getFloatExtra("S",28f);fnt=it.getIntExtra("F",0);iv=it.getLongExtra("I",400L);dur=it.getLongExtra("D",10L);alp=it.getFloatExtra("A",0.03f);rnd=it.getBooleanExtra("RND",false);mir=it.getBooleanExtra("MIR",false)}
          if(!run){run=true;loop()};return START_STICKY}
          private fun loop(){if(!run)return;h.postDelayed({
          val phrase=if(list.isNotEmpty())list.random() else "CREATE MY REALITY"
          v?.apply{
          if(mir){val r=phrase.reversed();val s=SpannableString("$phrase | $r");s.setSpan(ForegroundColorSpan(Color.RED),phrase.length+3,s.length,Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);text=s}else{text=phrase}
          textSize=sz;setTextColor(col);typeface=when(fnt){1->Typeface.SANS_SERIF;2->Typeface.SERIF;3->Typeface.create("cursive",Typeface.NORMAL);else->Typeface.MONOSPACE};alpha=alp;visibility=View.VISIBLE}
          p?.let{if(rnd){val m=resources.displayMetrics;it.x=Random.nextInt(-m.widthPixels/3,m.widthPixels/3);it.y=Random.nextInt(-m.heightPixels/4,m.heightPixels/4)}else{it.x=0;it.y=0};wm?.updateViewLayout(v,it)}
          h.postDelayed({v?.visibility=View.GONE;loop()},dur)},iv)}
          override fun onDestroy(){super.onDestroy();run=false;h.removeCallbacksAndMessages(null);v?.let{wm?.removeView(it)}}}
          EOF
          cat << 'EOF' > app/src/main/java/com/powermind/subliminal/MainActivity.kt
          @file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)
          package com.powermind.subliminal
          import android.content.*;import android.net.Uri;import android.os.*;import android.provider.Settings;import androidx.activity.ComponentActivity;import androidx.activity.compose.setContent
          import androidx.compose.foundation.*;import androidx.compose.foundation.layout.*;import androidx.compose.foundation.lazy.LazyColumn;import androidx.compose.foundation.shape.RoundedCornerShape;import androidx.compose.material3.*;import androidx.compose.runtime.*;import androidx.compose.ui.*;import androidx.compose.ui.graphics.Color;import androidx.compose.ui.platform.LocalContext;import androidx.compose.ui.text.font.*;import androidx.compose.ui.text.style.TextAlign;import androidx.compose.ui.unit.*;import kotlinx.coroutines.delay
          class MainActivity:ComponentActivity(){override fun onCreate(s:Bundle?){super.onCreate(s);setContent{MaterialTheme(colorScheme=darkColorScheme()){MainApp()}}}}
          @Composable fun MainApp(){val ctx=LocalContext.current
          val categories=remember{listOf("01. De-Program" to listOf("MUST SWITCH OFF THE TELEVISION","MUST STOP WATCHING TELEVISION","MUST STOP LISTENING TO THE RADIO","MUST KEEP AWAY FROM NEGATIVE PEOPLE","MUST STAY FOCUSED","MUST STAY POSITIVE","MUST TAKE ACTION","TAKE RESPONSIBILITY FOR MY ACTIONS","TALK TO MY CONSCIOUSNESS","THERE IS NO SUCH THING AS POVERTY ONLY ABUNDANCE","REPEL NEGATIVITY","MY AWARENESS LEVELS RISING","A PROBLEM SOLVER","THINK OUTSIDE THE BOX","A LEADER NOT A FOLLOWER","MY IMAGINATION CREATES REALITY","CREATE MY REALITY"),"02. Creative Mindset" to listOf("BE SUCCESSFUL","ACHIEVE MY GOALS","BE RICH","BE CREATIVE","TURN DREAMS INTO REALITY","IMAGINATION CREATES REALITY","THOUGHTS CREATE REALITY","COMMUNICATE WITH INFINITE INTELLIGENCE","CREATE MY REALITY","CAN SOLVE ANYTHING","THRIVE UNDER PRESSURE","ATTRACT WEALTH","WEALTH IS EASILY OBTAINABLE","ACT ON MY THOUGHTS","EVERYTHING I TOUCH TURNS TO GOLD","HAVE A MILLIONAIRE MINDSET"),"03. The £100,000 goal" to listOf("WILL MAKE £100,000 IN TWELVE MONTHS","FOR THE SERVICES OF MAN","FOR BOTH MIND VALUE AND MATERIAL VALUE","THAT GENERATES LIGHT AND SIMULTANEOUSLY NURTURES LOVE","MONEY COMES EASILY AND FREQUENTLY","MUST ACHIEVE MULTIPLE SOURCES OF INCOME","THERE IS ENOUGH MONEY GOING AROUND","INFINITE SUPPLY","MONEY MAGNET"),"04. The £500,000 goal" to listOf("WILL MAKE £500,000 IN TWELVE MONTHS","FOR THE SERVICES OF MAN","INFINITE SUPPLY","SUPPLY IS WITHOUT LIMITS","MONEY MAGNET"),"05. The £1,000,000 goal" to listOf("WILL MAKE £1,000,000 IN TWELVE MONTHS","EVERYTHING I TOUCH TURNS TO GOLD","HAVE A MILLIONAIRE MINDSET","DREAMERS NEVER SLEEP","INFINITE SUPPLY"),"06. Infinite Intelligence" to listOf("COMMUNICATE WITH INFINITE INTELLIGENCE","LOVE MY PINEAL GLAND","TALK TO MY CONSCIOUSNESS","MY MIND IS POWERFUL","ALL KNOWING AWARENESS","FOLLOW UNIVERSAL LAW","MY THOUGHTS COME FROM THE ETHER"),"07. Healthy Mind / Body" to listOf("HEALTHY","FEEL AND LOOK YOUNG","NEVER GET SICK","A POSITIVE MINDED PERSON","MUST EXERCISE","MUST STAY SLIM","MUST CONSUME MORE FRUIT AND VEGETABLES","WELLNESS","HEALTHY MIND HEALTHY BODY","PREVENTION IS THE BEST CURE"),"08. De-Stress" to listOf("CALM AND RELAXED","MEDITATION","CLEAR MY MIND","HAVE NO STRESS","HAPPY AND CONTENT","NEVER PANIC","THINK CLEAN POSITIVE THOUGHTS","SPIRITUALITY BRINGS ME CONTENTMENT","ONE WITH THE UNIVERSAL MIND"),"09. Self Confidence" to listOf("SELF CONFIDENT","SET MY GOALS HIGH","ACHIEVE ANYTHING","FOCUSED ON SUCCESS","LOVE MYSELF SO I CAN LOVE OTHERS","ABUNDANCE","TRUST ONLY YOURSELF","HAVE NO INSECURITIES","THERE IS NO SUCH THING AS FAILURE","A WINNER","MAKE EYE CONTACT WHEN I SPEAK"))}
          val checkedCats=remember{mutableStateListOf(0,1,2,5,6,7,8)}
          val customWords=remember{mutableStateListOf<String>()}
          val customSigils=remember{mutableStateListOf<String>()}
          var customWordInput by remember{mutableStateOf("")}
          var customSigilInput by remember{mutableStateOf("")}
          var modeIdx by remember{mutableStateOf(0)}
          var mirrorMode by remember{mutableStateOf(false)}
          var randomPos by remember{mutableStateOf(false)}
          var colIdx by remember{mutableStateOf(0)}
          var fontIdx by remember{mutableStateOf(0)}
          var fontSize by remember{mutableStateOf(24f)}
          var opacity by remember{mutableStateOf(0.05f)}
          var interval by remember{mutableStateOf(400L)}
          var duration by remember{mutableStateOf(10L)}
          var session by remember{mutableStateOf(false)}
          var overlayActive by remember{mutableStateOf(false)}
          val colors=listOf(Color.White to "White",Color.Black to "Black",Color.Cyan to "Cyan",Color.Yellow to "Yellow",Color.Green to "Green",Color(0xFFFF5252) to "Red",Color(0xFFFFD700) to "Gold")
          val colorInts=listOf(android.graphics.Color.WHITE,android.graphics.Color.BLACK,android.graphics.Color.CYAN,android.graphics.Color.YELLOW,android.graphics.Color.GREEN,android.graphics.Color.RED,0xFFFFD700.toInt())
          val fonts=listOf(FontFamily.Monospace to "Mono/Tahoma",FontFamily.SansSerif to "Sans",FontFamily.Serif to "Serif",FontFamily.Cursive to "Script")
          val modes=listOf("All Vowels Removed","A & I Removed","Keep A & I","Sigil Magic (Auto)","Raw")
          fun transform(text:String):String{val u=text.uppercase().trim();return when(modeIdx){0->u.replace(Regex("[AEIOU]"),"");1->u.replace(Regex("[AI]"),"");2->u.replace(Regex("[EOU]"),"");3->{val nv=u.replace(Regex("[AEIOU\\s]"),"");val sb=StringBuilder();val s=HashSet<Char>();for(c in nv)if(c in 'A'..'Z'&&s.add(c))sb.append(c);sb.toString()};else->u}}
          val activePool=remember(checkedCats.toList(),customWords.toList(),customSigils.toList(),modeIdx){val pool=mutableListOf<String>();checkedCats.forEach{if(it in categories.indices)pool.addAll(categories[it].second.map{w->transform(w)})};pool.addAll(customWords.map{w->transform(w)});pool.addAll(customSigils);if(pool.isEmpty())pool.add("CREATE MY REALITY");pool}
          if(session){var flash by remember{mutableStateOf("")};var vis by remember{mutableStateOf(false)}
          LaunchedEffect(activePool,interval,duration){while(true){delay(interval);flash=if(activePool.isNotEmpty())activePool.random() else "CREATE MY REALITY";vis=true;delay(duration);vis=false}}
          val bg=if(colIdx==1)Color.White else Color.Black
          Box(Modifier.fillMaxSize().background(bg).clickable{session=false},Alignment.Center){
          if(vis)Text(flash,color=colors[colIdx].first.copy(alpha=if(opacity<0.02f)0.05f else opacity),fontSize=fontSize.sp,fontFamily=fonts[fontIdx].first,fontWeight=FontWeight.Bold,textAlign=TextAlign.Center,modifier=Modifier.padding(24.dp))
          Text("Tap to exit session",color=if(colIdx==1)Color.DarkGray else Color.Gray,modifier=Modifier.align(Alignment.BottomCenter).padding(24.dp))};return}
          Scaffold(topBar={Surface(color=Color(0xFF0F172A)){Row(Modifier.fillMaxWidth().padding(horizontal=12.dp,vertical=10.dp),verticalAlignment=Alignment.CenterVertically){Text("POWER MIND SUBLIMINAL",fontWeight=FontWeight.Bold,color=Color.White,fontSize=15.sp);Spacer(Modifier.weight(1f));Text("Total: ${activePool.size} phrases",color=Color(0xFF38BDF8),fontSize=11.sp)}}}){pad->
          LazyColumn(Modifier.fillMaxSize().background(Color(0xFF090D16)).padding(pad).padding(12.dp),verticalArrangement=Arrangement.spacedBy(10.dp)){
          item{val cardBg=if(colIdx==1)Color.White else Color(0xFF1E293B)
          val previewText=remember(activePool.size,modeIdx){if(activePool.isNotEmpty())activePool.first() else "CREATE MY REALITY"}
          Card(colors=CardDefaults.cardColors(containerColor=Color(0xFF131C2E))){Column(Modifier.padding(10.dp)){
          Text("LIVE PREVIEW",fontWeight=FontWeight.Bold,fontSize=11.sp,color=Color.Gray)
          Box(Modifier.fillMaxWidth().height(60.dp).background(cardBg,RoundedCornerShape(6.dp)).border(1.dp,Color.Gray,RoundedCornerShape(6.dp)),Alignment.Center){Text(previewText,color=colors[colIdx].first.copy(alpha=if(opacity<0.15f)0.8f else opacity),fontSize=fontSize.sp,fontFamily=fonts[fontIdx].first,fontWeight=FontWeight.Bold)}
          Text("${fontSize.toInt()}sp • ${(opacity*100).toInt()}% opacity • ${activePool.size} active phrases in queue",fontSize=11.sp,color=Color.LightGray,modifier=Modifier.padding(top=4.dp))}}}
          item{Card(colors=CardDefaults.cardColors(containerColor=Color(0xFF131C2E))){Column(Modifier.padding(10.dp)){
          Text("1. Affirmation Categories (Decide Which To Use)",fontWeight=FontWeight.Bold,fontSize=13.sp,color=Color.White)
          categories.forEachIndexed{i,pair->val isChecked=checkedCats.contains(i)
          Row(Modifier.fillMaxWidth().clickable{if(isChecked)checkedCats.remove(i) else checkedCats.add(i)},verticalAlignment=Alignment.CenterVertically){
          Checkbox(checked=isChecked,onCheckedChange={if(it)checkedCats.add(i) else checkedCats.remove(i)})
          Text("${pair.first} (${pair.second.size})",fontSize=12.sp,color=if(isChecked)Color(0xFF38BDF8) else Color.LightGray)}}}}}
          item{Card(colors=CardDefaults.cardColors(containerColor=Color(0xFF131C2E))){Column(Modifier.padding(10.dp)){
          Text("2. Add Custom Words & Phrases",fontWeight=FontWeight.Bold,fontSize=13.sp,color=Color.White)
          Row(Modifier.fillMaxWidth().padding(top=4.dp),verticalAlignment=Alignment.CenterVertically){
          OutlinedTextField(value=customWordInput,onValueChange={customWordInput=it},label={Text("Type custom words / phrase")},modifier=Modifier.weight(1f).height(54.dp))
          Spacer(Modifier.width(6.dp))
          Button(onClick={if(customWordInput.isNotBlank()){customWords.add(customWordInput.trim().uppercase());customWordInput=""}},modifier=Modifier.height(44.dp)){Text("Add")}}
          if(customWords.isNotEmpty()){Text("Your Words (${customWords.size}): "+customWords.joinToString(", "),fontSize=11.sp,color=Color(0xFF38BDF8),modifier=Modifier.padding(top=4.dp))}}}}
          item{Card(colors=CardDefaults.cardColors(containerColor=Color(0xFF131C2E))){Column(Modifier.padding(10.dp)){
          Text("3. Multiple Choice Transformation Mode",fontWeight=FontWeight.Bold,fontSize=13.sp,color=Color.White)
          Row(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()).padding(top=4.dp),horizontalArrangement=Arrangement.spacedBy(6.dp)){
          modes.forEachIndexed{i,name->FilterChip(selected=modeIdx==i,onClick={modeIdx=i},label={Text(name,fontSize=11.sp)})}}
          Row(Modifier.fillMaxWidth().clickable{mirrorMode=!mirrorMode}.padding(top=4.dp),verticalAlignment=Alignment.CenterVertically){
          Checkbox(checked=mirrorMode,onCheckedChange={mirrorMode=it})
          Text("Mirrored Red-Letter Sigil (Page 26)",fontSize=12.sp,color=Color.LightGray)}
          Text("Add My Own Sigil Magic:",fontWeight=FontWeight.Bold,fontSize=12.sp,color=Color(0xFFC084FC),modifier=Modifier.padding(top=6.dp))
          Row(Modifier.fillMaxWidth().padding(top=2.dp),verticalAlignment=Alignment.CenterVertically){
          OutlinedTextField(value=customSigilInput,onValueChange={customSigilInput=it},label={Text("Enter direct custom sigil")},modifier=Modifier.weight(1f).height(54.dp))
          Spacer(Modifier.width(6.dp))
          Button(onClick={if(customSigilInput.isNotBlank()){customSigils.add(customSigilInput.trim().uppercase());customSigilInput=""}},modifier=Modifier.height(44.dp),colors=ButtonDefaults.buttonColors(containerColor=Color(0xFF7C3AED))){Text("Add Sigil")}}
          if(customSigils.isNotEmpty()){Text("Custom Sigils: "+customSigils.joinToString(", "),fontSize=11.sp,color=Color(0xFFC084FC),modifier=Modifier.padding(top=4.dp))}}}}
          item{Card(colors=CardDefaults.cardColors(containerColor=Color(0xFF131C2E))){Column(Modifier.padding(10.dp)){
          Text("4. Timing, Size & Appearance",fontWeight=FontWeight.Bold,fontSize=13.sp,color=Color.White)
          Text("Text Color:",fontSize=11.sp,color=Color.LightGray,modifier=Modifier.padding(top=4.dp))
          Row(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()),horizontalArrangement=Arrangement.spacedBy(6.dp)){
          colors.forEachIndexed{i,p->FilterChip(selected=colIdx==i,onClick={colIdx=i},label={Text(p.second,color=if(i==1)Color(0xFF90CAF9) else p.first)})}}
          Text("Font Style:",fontSize=11.sp,color=Color.LightGray,modifier=Modifier.padding(top=4.dp))
          Row(Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()),horizontalArrangement=Arrangement.spacedBy(6.dp)){
          fonts.forEachIndexed{i,p->FilterChip(selected=fontIdx==i,onClick={fontIdx=i},label={Text(p.second)})}}
          Text("Text Size: ${fontSize.toInt()}sp",fontSize=11.sp,color=Color.LightGray,modifier=Modifier.padding(top=4.dp))
          Slider(fontSize,{fontSize=it},valueRange=14f..48f)
          Text("Contrast / Opacity: ${(opacity*100).toInt()}% (Doc rec: 3%)",fontSize=11.sp,color=Color.LightGray)
          Slider(opacity,{opacity=it},valueRange=0.02f..1.0f)
          Text("Flash Every: ${interval}ms",fontSize=11.sp,color=Color.LightGray)
          Slider(interval.toFloat(),{interval=it.toLong()},valueRange=100f..2500f)
          Text("Flash Duration: ${duration}ms (Doc rec: 10ms)",fontSize=11.sp,color=Color.LightGray)
          Slider(duration.toFloat(),{duration=it.toLong()},valueRange=8f..300f)
          Row(Modifier.fillMaxWidth().clickable{randomPos=!randomPos},verticalAlignment=Alignment.CenterVertically){
          Checkbox(checked=randomPos,onCheckedChange={randomPos=it})
          Text("Random Peripheral Screen Placement",fontSize=12.sp,color=Color.LightGray)}}}}
          item{Button(onClick={session=true},modifier=Modifier.fillMaxWidth().height(48.dp),colors=ButtonDefaults.buttonColors(containerColor=Color(0xFF00897B))){Text("START IN-APP SESSION",fontWeight=FontWeight.Bold)}
          Spacer(Modifier.height(6.dp))
          Button(onClick={if(Build.VERSION.SDK_INT>=23&&!Settings.canDrawOverlays(ctx)){ctx.startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,Uri.parse("package:${ctx.packageName}")))}else{
          val it=Intent(ctx,SubliminalOverlayService::class.java).apply{putExtra("P",activePool.toTypedArray());putExtra("C",colorInts[colIdx]);putExtra("S",fontSize);putExtra("F",fontIdx);putExtra("I",interval);putExtra("D",duration);putExtra("A",opacity);putExtra("RND",randomPos);putExtra("MIR",mirrorMode)}
          if(!overlayActive){ctx.startService(it);overlayActive=true}else{ctx.stopService(it);overlayActive=false}}},modifier=Modifier.fillMaxWidth().height(48.dp),colors=ButtonDefaults.buttonColors(containerColor=if(overlayActive)Color(0xFFDC2626) else Color(0xFF1E88E5))){Text(if(overlayActive)"STOP OVERLAY" else "LAUNCH SYSTEM OVERLAY",fontWeight=FontWeight.Bold)}
          Spacer(Modifier.height(16.dp))}}}}}
          EOF
      - run: gradle assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PowerMind-OnePlus15-APK
          path: app/build/outputs/apk/debug/app-debug.apk
