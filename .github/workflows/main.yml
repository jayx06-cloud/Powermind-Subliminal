name: Build PowerMind APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Generate Android Project Files
        run: |
          mkdir -p app/src/main/java/com/powermind/subliminal

          # 1. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PowerMind"
          include(":app")
          EOF

          # 2. build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 3. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.powermind.subliminal"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.powermind.subliminal"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation(platform("androidx.compose:compose-bom:2024.11.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
          }
          EOF

          # 4. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="PowerMind"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".SubliminalOverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Subliminal affirmations overlay" />
                  </service>
              </application>
          </manifest>
          EOF

          # 5. SubliminalOverlayService.kt
          cat << 'EOF' > app/src/main/java/com/powermind/subliminal/SubliminalOverlayService.kt
          package com.powermind.subliminal

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.text.SpannableString
          import android.text.Spanned
          import android.text.style.ForegroundColorSpan
          import android.view.Choreographer
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.TextView
          import androidx.core.app.NotificationCompat
          import kotlin.random.Random

          class SubliminalOverlayService : Service() {

              private var windowManager: WindowManager? = null
              private var overlayView: TextView? = null
              private var params: WindowManager.LayoutParams? = null
              private val handler = Handler(Looper.getMainLooper())
              private var isRunning = false

              private var phrases: List<String> = emptyList()
              private var intervalMs: Long = 400
              private var durationMs: Long = 10
              private var contrastAlpha: Float = 0.05f
              private var useRandomPlacement: Boolean = true
              private var useMirroredSigil: Boolean = false

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          "powermind_fgs",
                          "PowerMind Flash Service",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java)?.createNotificationChannel(channel)
                  }

                  val notification = NotificationCompat.Builder(this, "powermind_fgs")
                      .setContentTitle("PowerMind Active")
                      .setContentText("Subconscious registration active in background")
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .build()

                  startForeground(1001, notification)
                  setupOverlay()
              }

              private fun setupOverlay() {
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val type = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      type,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.CENTER
                  }

                  overlayView = TextView(this).apply {
                      textSize = 28f
                      setTextColor(Color.WHITE)
                      visibility = View.GONE
                  }

                  windowManager?.addView(overlayView, params)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  intent?.let {
                      phrases = it.getStringArrayExtra("PHRASES")?.toList() ?: emptyList()
                      intervalMs = it.getLongExtra("INTERVAL_MS", 400L)
                      durationMs = it.getLongExtra("DURATION_MS", 10L)
                      contrastAlpha = it.getFloatExtra("CONTRAST_ALPHA", 0.05f)
                      useRandomPlacement = it.getBooleanExtra("RANDOM_POS", true)
                      useMirroredSigil = it.getBooleanExtra("MIRRORED_SIGIL", false)

                      if (!isRunning && phrases.isNotEmpty()) {
                          isRunning = true
                          scheduleNext()
                      }
                  }
                  return START_STICKY
              }

              private fun scheduleNext() {
                  if (!isRunning || phrases.isEmpty()) return
                  handler.postDelayed({ executeFlash() }, intervalMs)
              }

              private fun executeFlash() {
                  val phrase = phrases.random()
                  val display = overlayView ?: return

                  if (useMirroredSigil) {
                      val reversed = phrase.reversed()
                      val combined = "$phrase | $reversed"
                      val span = SpannableString(combined)
                      span.setSpan(
                          ForegroundColorSpan(Color.RED),
                          phrase.length + 3,
                          combined.length,
                          Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
                      )
                      display.text = span
                  } else {
                      display.text = phrase
                  }

                  display.alpha = contrastAlpha

                  if (useRandomPlacement) {
                      val metrics = resources.displayMetrics
                      params?.x = Random.nextInt(-metrics.widthPixels / 3, metrics.widthPixels / 3)
                      params?.y = Random.nextInt(-metrics.heightPixels / 4, metrics.heightPixels / 4)
                      windowManager?.updateViewLayout(display, params)
                  }

                  display.visibility = View.VISIBLE

                  if (durationMs <= 16) {
                      Choreographer.getInstance().postFrameCallback {
                          display.visibility = View.GONE
                          scheduleNext()
                      }
                  } else {
                      handler.postDelayed({
                          display.visibility = View.GONE
                          scheduleNext()
                      }, durationMs)
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  isRunning = false
                  handler.removeCallbacksAndMessages(null)
                  overlayView?.let { windowManager?.removeView(it) }
              }
          }
          EOF

          # 6. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/powermind/subliminal/MainActivity.kt
          package com.powermind.subliminal

          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.rotate
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.Path
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.delay
          import kotlin.concurrent.thread
          import kotlin.math.cos
          import kotlin.math.sin

          enum class VowelMode { REMOVE_ALL_VOWELS, KEEP_A_AND_I, SIGIL_MAGIC, RAW_TEXT }

          object SigilEngine {
              fun processPhrase(text: String, mode: VowelMode): String {
                  val upper = text.uppercase().trim()
                  return when (mode) {
                      VowelMode.REMOVE_ALL_VOWELS -> upper.replace(Regex("[AEIOU]"), "")
                      VowelMode.KEEP_A_AND_I -> upper.replace(Regex("[EOU]"), "")
                      VowelMode.SIGIL_MAGIC -> {
                          val noVowels = upper.replace(Regex("[AEIOU\\s]"), "")
                          val unique = StringBuilder()
                          val seen = HashSet<Char>()
                          for (ch in noVowels) {
                              if (ch in 'A'..'Z' && seen.add(ch)) unique.append(ch)
                          }
                          unique.toString()
                      }
                      VowelMode.RAW_TEXT -> upper
                  }
              }
          }

          object AudioEngine {
              private var audioTrack: AudioTrack? = null
              @Volatile private var isPlaying = false

              fun startTone(frequencyHz: Double = 528.0) {
                  if (isPlaying) stopTone()
                  isPlaying = true
                  thread(priority = Thread.NORM_PRIORITY) {
                      val sampleRate = 44100
                      val minBuf = AudioTrack.getMinBufferSize(sampleRate, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT)
                      audioTrack = AudioTrack.Builder()
                          .setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build())
                          .setAudioFormat(AudioFormat.Builder().setSampleRate(sampleRate).setChannelMask(AudioFormat.CHANNEL_OUT_MONO).setEncoding(AudioFormat.ENCODING_PCM_16BIT).build())
                          .setBufferSizeInBytes(minBuf).setTransferMode(AudioTrack.MODE_STREAM).build()
                      audioTrack?.play()
                      val buf = ShortArray(minBuf)
                      var angle = 0.0
                      while (isPlaying) {
                          for (i in buf.indices) {
                              buf[i] = (sin(angle) * 7000).toInt().toShort()
                              angle += 2.0 * Math.PI * frequencyHz / sampleRate
                              if (angle > 2.0 * Math.PI) angle -= 2.0 * Math.PI
                          }
                          audioTrack?.write(buf, 0, buf.size)
                      }
                      try { audioTrack?.stop(); audioTrack?.release() } catch (_: Exception) {}
                  }
              }

              fun stopTone() { isPlaying = false }
          }

          data class Category(val id: Int, val name: String, val phrases: List<String>)

          object SubliminalLibrary {
              val categories = listOf(
                  Category(1, "1. De-Program", listOf("MUST SWITCH OFF THE TELEVISION", "MUST STOP WATCHING TELEVISION", "MUST STOP LISTENING TO THE RADIO", "MUST KEEP AWAY FROM NEGATIVE PEOPLE", "MUST STAY FOCUSED", "MUST STAY POSITIVE", "MUST TAKE ACTION", "TAKE RESPONSIBILITY FOR MY ACTIONS", "TALK TO MY CONSCIOUSNESS", "THERE IS NO SUCH THING AS POVERTY ONLY ABUNDANCE", "REPEL NEGATIVITY", "MY AWARENESS LEVELS RISING", "A PROBLEM SOLVER", "THINK OUTSIDE THE BOX", "A LEADER NOT A FOLLOWER", "MY IMAGINATION CREATES REALITY", "CREATE MY REALITY")),
                  Category(2, "2. Creative Mindset", listOf("BE SUCCESSFUL", "ACHIEVE MY GOALS", "BE RICH", "BE CREATIVE", "TURN DREAMS INTO REALITY", "IMAGINATION CREATES REALITY", "THOUGHTS CREATE REALITY", "COMMUNICATE WITH INFINITE INTELLIGENCE", "CREATE MY REALITY", "CAN SOLVE ANYTHING", "THRIVE UNDER PRESSURE", "ATTRACT WEALTH", "WEALTH IS EASILY OBTAINABLE", "ACT ON MY THOUGHTS", "EVERYTHING I TOUCH TURNS TO GOLD", "HAVE A MILLIONAIRE MINDSET")),
                  Category(3, "3. Wealth Goals ($100k - $1M)", listOf("WILL MAKE 100000 IN TWELVE MONTHS", "FOR THE SERVICES OF MAN", "FOR BOTH MIND VALUE AND MATERIAL VALUE", "THAT GENERATES LIGHT AND SIMULTANEOUSLY NURTURES LOVE", "MONEY COMES EASILY AND FREQUENTLY", "MUST ACHIEVE MULTIPLE SOURCES OF INCOME", "THERE IS ENOUGH MONEY GOING AROUND", "INFINITE SUPPLY", "SUPPLY IS WITHOUT LIMITS", "MONEY MAGNET")),
                  Category(6, "6. Connect to Infinite Intelligence", listOf("COMMUNICATE WITH INFINITE INTELLIGENCE", "LOVE MY PINEAL GLAND", "TALK TO MY CONSCIOUSNESS", "MY MIND IS POWERFUL", "ALL KNOWING AWARENESS", "FOLLOW UNIVERSAL LAW", "MY THOUGHTS COME FROM THE ETHER")),
                  Category(7, "7. Healthy Mind / Body", listOf("HEALTHY", "FEEL AND LOOK YOUNG", "NEVER GET SICK", "A POSITIVE MINDED PERSON", "MUST EXERCISE", "MUST STAY SLIM", "MUST CONSUME MORE FRUIT AND VEGETABLES", "WELLNESS", "HEALTHY MIND HEALTHY BODY", "PREVENTION IS THE BEST CURE")),
                  Category(8, "8. De-Stress", listOf("CALM AND RELAXED", "MEDITATION", "CLEAR MY MIND", "HAVE NO STRESS", "HAPPY AND CONTENT", "NEVER PANIC", "THINK CLEAN POSITIVE THOUGHTS", "SPIRITUALITY BRINGS ME CONTENTMENT", "ONE WITH THE UNIVERSAL MIND")),
                  Category(9, "9. Self Confidence", listOf("SELF CONFIDENT", "SET MY GOALS HIGH", "ACHIEVE ANYTHING", "FOCUSED ON SUCCESS", "LOVE MYSELF SO I CAN LOVE OTHERS", "ABUNDANCE", "TRUST ONLY YOURSELF", "HAVE NO INSECURITIES", "THERE IS NO SUCH THING AS FAILURE", "A WINNER", "MAKE EYE CONTACT WHEN I SPEAK"))
              )
          }

          enum class SpeedPreset(val label: String, val intervalMs: Long, val durationMs: Long, val contrast: Float) {
              SLOW("Slow", 2000L, 250L, 0.70f),
              NORMAL("Normal", 1000L, 80L, 0.40f),
              FAST("Fast", 500L, 30L, 0.15f),
              SUBLIMINAL("Subliminal", 400L, 10L, 0.03f)
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme()) {
                          PowerMindApp()
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun PowerMindApp() {
              val context = LocalContext.current
              var selectedCategoryId by remember { mutableStateOf(1) }
              var vowelMode by remember { mutableStateOf(VowelMode.REMOVE_ALL_VOWELS) }
              var speedPreset by remember { mutableStateOf(SpeedPreset.SUBLIMINAL) }

              var intervalMs by remember { mutableStateOf(400L) }
              var durationMs by remember { mutableStateOf(10L) }
              var contrast by remember { mutableStateOf(0.03f) }
              var randomPlacement by remember { mutableStateOf(true) }
              var mirroredSigil by remember { mutableStateOf(false) }
              var soundFrequencyEnabled by remember { mutableStateOf(false) }

              var isSessionActive by remember { mutableStateOf(false) }
              var isOverlayActive by remember { mutableStateOf(false) }

              val currentCategory = SubliminalLibrary.categories.firstOrNull { it.id == selectedCategoryId }
              val currentPhrases = currentCategory?.phrases ?: emptyList()
              val processedPhrases = remember(currentPhrases, vowelMode) {
                  currentPhrases.map { SigilEngine.processPhrase(it, vowelMode) }
              }

              if (isSessionActive) {
                  InAppSession(
                      phrases = processedPhrases,
                      intervalMs = intervalMs,
                      durationMs = durationMs,
                      contrast = contrast,
                      onClose = {
                          AudioEngine.stopTone()
                          isSessionActive = false
