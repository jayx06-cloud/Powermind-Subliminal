          @Composable fun SacredVideoSession(phrases:List<String>,interval:Long,duration:Long,contrast:Float,activeColorInts:IntArray,fSize:Float,activeFontIndices:IntArray,fonts:List<Pair<FontFamily,String>>,jitter:Boolean,pyramidFocal:Boolean,dualPillars:Boolean,runeOn:Boolean,onClose:()->Unit){
          var text by remember{mutableStateOf("")};var vis by remember{mutableStateOf(false)};var curCol by remember{mutableStateOf(Color.White)};var curFnt by remember{mutableStateOf(fonts.first().first)};var timeLeft by remember{mutableStateOf(300)}
          val runes=listOf("ᚠ","ᛏ","ᛋ","ᚢ","ᛉ","ᛃ")
          LaunchedEffect(Unit){while(timeLeft>0){delay(1000L);timeLeft--};onClose()}
          LaunchedEffect(phrases,interval,duration,jitter){while(true){val wait=if(jitter)kotlin.random.Random.nextLong((interval*0.85).toLong().coerceAtLeast(50L),(interval*1.15).toLong()) else interval;delay(wait);text=if(runeOn&&kotlin.random.Random.nextInt(3)==0)runes.random() else phrases.random();val cInt=if(activeColorInts.isNotEmpty())activeColorInts.random() else android.graphics.Color.WHITE;curCol=Color(cInt);val fIdx=if(activeFontIndices.isNotEmpty())activeFontIndices.random() else 0;curFnt=fonts[fIdx.coerceIn(0,fonts.lastIndex)].first;vis=true;delay(duration);vis=false}}
          val rot by rememberInfiniteTransition(label="").animateFloat(0f,360f,infiniteRepeatable(tween(24000,easing=LinearEasing)),label="")
          Box(Modifier.fillMaxSize().background(Color.Black)){
          Canvas(Modifier.fillMaxSize().rotate(rot)){
          val c=Offset(this.size.width/2,this.size.height/2);val r=this.size.minDimension*0.38f
          for(i in 1..4)drawCircle(Color(0xFF00E5FF).copy(alpha=0.10f),r*(i/4f),c,style=Stroke(2.dp.toPx()))
          for(deg in 0..7){val a=Math.toRadians(deg*45.0);val x2=(c.x+r*cos(a)).toFloat();val y2=(c.y+r*sin(a)).toFloat();drawLine(Color(0xFF38BDF8).copy(alpha=0.15f),c,Offset(x2,y2),2.dp.toPx())}
          for(i in 0..5){val ringA=Math.toRadians(i*60.0);val rx=(c.x+r*0.62f*cos(ringA)).toFloat();val ry=(c.y+r*0.62f*sin(ringA)).toFloat();drawCircle(Color(0xFFFFD700).copy(alpha=0.25f),r*0.22f,Offset(rx,ry),style=Stroke(1.5.dp.toPx()))}
          val p=Path().apply{moveTo(c.x,c.y-r);lineTo(c.x+r*cos(Math.toRadians(30.0)).toFloat(),c.y+r*sin(Math.toRadians(30.0)).toFloat());lineTo(c.x-r*cos(Math.toRadians(30.0)).toFloat(),c.y+r*sin(Math.toRadians(30.0)).toFloat());close()}
          drawPath(p,Color.White.copy(alpha=0.20f),style=Stroke(3.dp.toPx()))
          drawCircle(Color(0xFFFFD700).copy(alpha=0.35f),8.dp.toPx(),Offset(c.x,c.y+r*0.33f))}
          if(dualPillars){
          val pText=remember(text){val clean=text.filter{it in 'A'..'Z'}.take(7);if(clean.isNotEmpty())clean else "PWMRND"}
          Column(Modifier.align(Alignment.CenterStart).padding(start=6.dp).width(36.dp).background(Color(0x221E293B),RoundedCornerShape(4.dp)).border(1.dp,Color(0x4438BDF8),RoundedCornerShape(4.dp)).padding(2.dp),horizontalAlignment=Alignment.CenterHorizontally){for(ch in pText){Row{Text("$ch",color=Color.White,fontSize=10.sp,fontWeight=FontWeight.Bold);Spacer(Modifier.width(2.dp));Text("$ch",color=Color.Red,fontSize=10.sp,fontWeight=FontWeight.Bold,modifier=Modifier.scale(scaleX=-1f,scaleY=1f))}}}
          Column(Modifier.align(Alignment.CenterEnd).padding(end=6.dp).width(36.dp).background(Color(0x221E293B),RoundedCornerShape(4.dp)).border(1.dp,Color(0x4438BDF8),RoundedCornerShape(4.dp)).padding(2.dp),horizontalAlignment=Alignment.CenterHorizontally){for(ch in pText){Row{Text("$ch",color=Color.White,fontSize=10.sp,fontWeight=FontWeight.Bold);Spacer(Modifier.width(2.dp));Text("$ch",color=Color.Red,fontSize=10.sp,fontWeight=FontWeight.Bold,modifier=Modifier.scale(scaleX=-1f,scaleY=1f))}}}
          }
          if(vis){
          val focalAlignment=if(pyramidFocal)Alignment.BottomCenter else Alignment.Center;val padBottom=if(pyramidFocal)120.dp else 0.dp
          val sigilLetters=text.filter{it in 'A'..'Z'}.take(6)
          Box(Modifier.align(focalAlignment).padding(bottom=padBottom).background(Color(0x330B111C),RoundedCornerShape(8.dp)).border(1.dp,Color(0x6638BDF8),RoundedCornerShape(8.dp)).padding(horizontal=16.dp,vertical=6.dp),Alignment.Center){
          if(text.length==1){Text(text,color=curCol.copy(alpha=if(contrast<0.05f)0.05f else contrast),fontSize=(fSize*1.6f).sp,fontWeight=FontWeight.Black,fontFamily=curFnt)}
          else{Column(horizontalAlignment=Alignment.CenterHorizontally){
          for(ch in sigilLetters){Row{Text("$ch",color=curCol.copy(alpha=if(contrast<0.05f)0.05f else contrast),fontSize=fSize.sp,fontWeight=FontWeight.Black,fontFamily=curFnt);Spacer(Modifier.width(8.dp));Text("$ch",color=Color.Red.copy(alpha=if(contrast<0.05f)0.05f else contrast),fontSize=fSize.sp,fontWeight=FontWeight.Black,fontFamily=curFnt,modifier=Modifier.scale(scaleX=-1f,scaleY=1f))}}
          }}}}
          Row(Modifier.align(Alignment.TopStart).padding(16.dp),verticalAlignment=Alignment.CenterVertically){Text("5-MIN SESSION: ${timeLeft/60}:${(timeLeft%60).toString().padStart(2,'0')}",color=Color(0xFF38BDF8),fontSize=12.sp,fontWeight=FontWeight.Bold)}
          IconButton(onClick=onClose,modifier=Modifier.align(Alignment.TopEnd).padding(16.dp)){Text("✕",color=Color.White,fontSize=24.sp,fontWeight=FontWeight.Bold)}
          }}
