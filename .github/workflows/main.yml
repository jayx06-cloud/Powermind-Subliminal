          Text("3. Unified Master Library",fontWeight=FontWeight.Bold,fontSize=12.sp,color=Color(0xFFFACC15))
          Text("All affirmations (wealth, cocaine cessation, health, mindset) are unified into one active pool. You can add your own words using '+ New Phrase'.",fontSize=11.sp,color=Color.LightGray)
          Text("4. D-Pad Remote Navigation",fontWeight=FontWeight.Bold,fontSize=12.sp,color=Color(0xFFFACC15))
          Text("Navigate with your Fire TV remote directional buttons; active selections glow in cyan/blue.",fontSize=11.sp,color=Color.LightGray)
          }})}
