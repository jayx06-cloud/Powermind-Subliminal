          object AudioTrackEngine{private var t:AudioTrack?=null;@Volatile private var p=false;fun start(){stop();p=true;thread{val sr=44100;val b=AudioTrack.getMinBufferSize(sr,AudioFormat.CHANNEL_OUT_STEREO,AudioFormat.ENCODING_PCM_16BIT);t=AudioTrack.Builder().setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build()).setAudioFormat(AudioFormat.Builder().setSampleRate(sr).setChannelMask(AudioFormat.CHANNEL_OUT_STEREO).setEncoding(AudioFormat.ENCODING_PCM_16BIT).build()).setBufferSizeInBytes(b).setTransferMode(AudioTrack.MODE_STREAM).build();t?.play();val buf=ShortArray(b);var aL=0.0;var aR=0.0;var aOM=0.0;val fL=528.0;val fR=534.0;val fOM=136.1;while(p){var i=0;while(i<buf.size-1){val om=sin(aOM)*3500.0;buf[i]=((sin(aL)*4800.0)+om).toInt().coerceIn(-32767,32767).toShort();buf[i+1]=((sin(aR)*4800.0)+om).toInt().coerceIn(-32767,32767).toShort();aL+=2.0*Math.PI*fL/sr;aR+=2.0*Math.PI*fR/sr;aOM+=2.0*Math.PI*fOM/sr;i+=2};t?.write(buf,0,buf.size)};try{t?.stop();t?.release()}catch(e:Exception){}}};fun stop(){p=false;try{t?.stop();t?.release();t=null}catch(e:Exception){}}}
