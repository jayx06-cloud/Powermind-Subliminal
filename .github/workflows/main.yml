                      item {
                          Card(colors = CardDefaults.cardColors(containerColor = Color(0xFF141B26)), shape = RoundedCornerShape(10.dp)) {
                              Column(modifier = Modifier.padding(14.dp)) {
                                  Text("Interval: ${intervalMs}ms | Duration: ${durationMs}ms | Opacity: ${(contrast * 100).toInt()}%", color = Color.White, fontSize = 11.sp)
                                  Slider(value = intervalMs.toFloat(), onValueChange = { intervalMs = it.toLong() }, valueRange = 100f..2000f)
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Checkbox(checked = randomPlacement, onCheckedChange = { randomPlacement = it })
                                      Text("Random Screen Position", color = Color.White, fontSize = 12.sp)
                                  }
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Checkbox(checked = mirroredSigil, onCheckedChange = { mirroredSigil = it })
                                      Text("Mirrored Red-Sigil (Page 26)", color = Color.White, fontSize = 12.sp)
