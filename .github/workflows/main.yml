                  }
              }
          }

          @Composable
          fun VowelRadioRow(title: String, selected: Boolean, onClick: () -> Unit) {
              Row(
                  modifier = Modifier.fillMaxWidth().background(if (selected) Color(0xFF1B2836) else Color(0xFF101620), RoundedCornerShape(6.dp)).clickable(onClick = onClick).padding(8.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  RadioButton(selected = selected, onClick = onClick)
                  Spacer(modifier = Modifier.width(6.dp))
                  Text(title, color = Color.White, fontSize = 12.sp)
              }
          }

          @Composable
          fun InAppSession(phrases: List<String>, intervalMs: Long, durationMs: Long, contrast: Float, onClose: () -> Unit) {
              var flashText by remember { mutableStateOf("") }
              var isVisible by remember { mutableStateOf(false) }

              LaunchedEffect(phrases, intervalMs, durationMs) {
                  if (phrases.isEmpty()) return@LaunchedEffect
                  while (true) {
                      delay(intervalMs)
                      flashText = phrases.random()
                      isVisible = true
                      delay(durationMs)
                      isVisible = false
                  }
              }

              val infiniteTransition = rememberInfiniteTransition(label = "spin")
              val angle by infiniteTransition.animateFloat(
                  initialValue = 0f, targetValue = 360f,
                  animationSpec = infiniteRepeatable(animation = tween(24000, easing = LinearEasing)), label = "angle"
              )

              Box(modifier = Modifier.fillMaxSize().background(Color.Black), contentAlignment = Alignment.Center) {
                  Canvas(modifier = Modifier.fillMaxSize().rotate(angle)) {
                      val center = Offset(size.width / 2, size.height / 2)
                      val radius = size.width.coerceAtMost(size.height) * 0.35f
                      for (i in 1..4) {
                          drawCircle(color = Color.Cyan.copy(alpha = 0.12f), radius = radius * (i / 4f), center = center, style = Stroke(2.dp.toPx()))
                      }
                      val p = Path()
                      p.moveTo(center.x, center.y - radius)
                      p.lineTo(center.x + radius * cos(Math.toRadians(30.0)).toFloat(), center.y + radius * sin(Math.toRadians(30.0)).toFloat())
                      p.lineTo(center.x - radius * cos(Math.toRadians(30.0)).toFloat(), center.y + radius * sin(Math.toRadians(30.0)).toFloat())
                      p.close()
                      drawPath(p, color = Color.White.copy(alpha = 0.25f), style = Stroke(3.dp.toPx()))
                  }

                  if (isVisible) {
                      Text(
                          text = flashText,
                          color = Color.White.copy(alpha = contrast),
                          fontSize = 30.sp,
                          fontWeight = FontWeight.Black,
                          fontFamily = FontFamily.Monospace,
                          textAlign = TextAlign.Center,
                          modifier = Modifier.padding(32.dp).align(Alignment.Center)
                      )
                  }

                  IconButton(onClick = onClose, modifier = Modifier.align(Alignment.TopEnd).padding(20.dp)) {
                      Text("✕", color = Color.White, fontSize = 24.sp, fontWeight = FontWeight.Bold)
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PowerMind-OnePlus15-APK
          path: app/build/outputs/apk/debug/app-debug.apk
