          @Composable fun AboutGuideDialog(onClose:()->Unit){
          AlertDialog(onDismissRequest=onClose,confirmButton={Button(onClick=onClose){Text("Close")}},title={Text("PowerMind Master TV Guide",fontSize=14.sp,fontWeight=FontWeight.Bold,color=Color(0xFF38BDF8))},text={
          Column(Modifier.fillMaxWidth().height(360.dp).verticalScroll(rememberScrollState()),verticalArrangement=Arrangement.spacedBy(8.dp)){
          Text("1. Applying Settings",fontWeight=FontWeight.Bold,fontSize=12.sp,color=Color(0xFFFACC15))
          Text("After adjusting timings, contrast, or geometry, click the blue 'APPLY SETTINGS' button to instantly lock them into the active engine.",fontSize=11.sp,color=Color.LightGray)
