          @Composable fun FireTvSacredSession(phrases:List<String>,interval:Long,duration:Long,contrast:Float,colorInts:List<Int>,fSize:Float,fonts:List<Pair<FontFamily,String>>,jitter:Boolean,pyramidFocal:Boolean,dualPillars:Boolean,altSigils:Boolean,runeOn:Boolean,audioOn:Boolean,visionOn:Boolean,maskOn:Boolean,infinite:Boolean,onClose:()->Unit){
          val ctx=LocalContext.current
          var text by remember{mutableStateOf("")};var vis by remember{mutableStateOf(false)};var curCol by remember{mutableStateOf(Color.White)};var curFnt by remember{mutableStateOf(fonts.first().first)};var timeLeft by remember{mutableStateOf(300)};var isUpright by remember{mutableStateOf(true)};var activeRune by remember{mutableStateOf("ᚠ")};var isMask by remember{mutableStateOf(false)};var showSymbol by remember{mutableStateOf(false)};var symbolIdx by remember{mutableStateOf(0)}
          val runes=listOf("ᚠ","ᛏ","ᛋ","ᚢ","ᛉ","ᛃ")
          val tts=remember{var e:TextToSpeech?=null;e=TextToSpeech(ctx){s->if(s==TextToSpeech.SUCCESS){e?.setSpeechRate(1.9f);e?.setPitch(0.95f)}};e}
          DisposableEffect(Unit){onDispose{tts?.stop();tts?.shutdown()}}
          LaunchedEffect(Unit){while(timeLeft>0){delay(1000L);if(!infinite)timeLeft--};if(!infinite)onClose()}
          LaunchedEffect(phrases,interval,duration,jitter){while(true){val wait=if(jitter)kotlin.random.Random.nextLong((interval*0.85).toLong().coerceAtLeast(50L),(interval*1.15).toLong()) else interval;delay(wait);text=phrases.random();activeRune=runes.random();isUpright=!isUpright;curCol=Color(colorInts.random());curFnt=fonts.random().first
          if(maskOn){isMask=true;delay(8L);isMask=false}
          if(audioOn){val b=Bundle().apply{putFloat(TextToSpeech.Engine.KEY_PARAM_VOLUME,0.14f)};tts?.speak(text,TextToSpeech.QUEUE_FLUSH,b,"sub_tv")}
          if(visionOn&&kotlin.random.Random.nextBoolean()){symbolIdx=(symbolIdx+1)%4;showSymbol=true;delay(duration);showSymbol=false}else{vis=true;delay(duration);vis=false}
          if(maskOn){isMask=true;delay(8L);isMask=false}}}
          val rot by rememberInfiniteTransition(label="").animateFloat(0f,360f,infiniteRepeatable(tween(24000,easing=LinearEasing)),label="")
          Box(Modifier.fillMaxSize().background(Color.Black)){
          Canvas(Modifier.fillMaxSize().rotate(rot)){
          val c=Offset(this.size.width/2,this.size.height/2);val r=this.size.minDimension*0.42f;val mAlpha=if(isMask)0.45f else 0.10f
          for(i in 1..4)drawCircle(Color(0xFF00E5FF).copy(alpha=mAlpha),r*(i/4f),c,style=Stroke(2.dp.toPx()))
          for(deg in 0..7){val a=Math.toRadians(deg*45.0);val x2=(c.x+r*cos(a)).toFloat();val y2=(c.y+r*sin(a)).toFloat();drawLine(Color(0xFF38BDF8).copy(alpha=if(isMask)0.35f else 0.14f),c,Offset(x2,y2),2.dp.toPx())}
          for(i in 0..5){val ringA=Math.toRadians(i*60.0);val rx=(c.x+r*0.62f*cos(ringA)).toFloat();val ry=(c.y+r*0.62f*sin(ringA)).toFloat();drawCircle(Color(0xFFFFD700).copy(alpha=0.22f),r*0.22f,Offset(rx,ry),style=Stroke(1.5.dp.toPx()))}
          val p=Path().apply{moveTo(c.x,c.y-r);lineTo(c.x+r*cos(Math.toRadians(30.0)).toFloat(),c.y+r*sin(Math.toRadians(30.0)).toFloat());lineTo(c.x-r*cos(Math.toRadians(30.0)).toFloat(),c.y+r*sin(Math.toRadians(30.0)).toFloat());close()}
          drawPath(p,Color.White.copy(alpha=if(isMask)0.40f else 0.20f),style=Stroke(3.dp.toPx()))
          drawCircle(Color(0xFFFFD700).copy(alpha=if(isMask)0.60f else 0.35f),10.dp.toPx(),Offset(c.x,c.y+r*0.33f))}
          if(dualPillars){
