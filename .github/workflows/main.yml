          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.delay
          import kotlin.concurrent.thread
          import kotlin.math.cos
          import kotlin.math.sin

          enum class VowelMode { REMOVE_ALL_VOWELS, KEEP_A_AND_I, SIGIL_MAGIC, RAW_TEXT }

          object SigilEngine {
              fun processPhrase(text: String, mode: VowelMode): String {
                  val upper = text.uppercase().trim()
                  return when (mode) {
                      VowelMode.REMOVE_ALL_VOWELS -> upper.replace(Regex("[AEIOU]"), "")
                      VowelMode.KEEP_A_AND_I -> upper.replace(Regex("[EOU]"), "")
                      VowelMode.SIGIL_MAGIC -> {
                          val noVowels = upper.replace(Regex("[AEIOU\\s]"), "")
                          val unique = StringBuilder()
                          val seen = HashSet<Char>()
                          for (ch in noVowels) {
                              if (ch in 'A'..'Z' && seen.add(ch)) unique.append(ch)
                          }
                          unique.toString()
                      }
                      VowelMode.RAW_TEXT -> upper
                  }
              }
          }

          object AudioEngine {
              private var audioTrack: AudioTrack? = null
              @Volatile private var isPlaying = false

              fun startTone(frequencyHz: Double = 528.0) {
                  if (isPlaying) stopTone()
                  isPlaying = true
                  thread(priority = Thread.NORM_PRIORITY) {
                      val sampleRate = 44100
                      val minBuf = AudioTrack.getMinBufferSize(sampleRate, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT)
                      audioTrack = AudioTrack.Builder()
                          .setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build())
                          .setAudioFormat(AudioFormat.Builder().setSampleRate(sampleRate).setChannelMask(AudioFormat.
